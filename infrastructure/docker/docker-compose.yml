version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://foodshield:foodshield@db:5432/foodshield
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_ENDPOINT=http://minio:9000
    depends_on:
      - db
      - redis
      - minio

  ai-engine:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.ai
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foodshield
      POSTGRES_PASSWORD: foodshield
      POSTGRES_DB: foodshield
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://foodshield:foodshield@db:5432/mlflow
    ports:
      - "5000:5000"
    depends_on:
      - db

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  minio_data:
