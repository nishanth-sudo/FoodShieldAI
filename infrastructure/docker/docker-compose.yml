version: "3.9"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - foodshield-net
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    environment:
      - DATABASE_URL=postgresql+asyncpg://foodshield:foodshield@db:5432/foodshield
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_ENDPOINT=http://minio:9000
      - FOODSHIELD_LOG_LEVEL=INFO
      - FOODSHIELD_RATE_LIMIT_ENABLED=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - foodshield-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  ai-engine:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.ai
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - foodshield-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foodshield
      POSTGRES_PASSWORD: foodshield
      POSTGRES_DB: foodshield
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - foodshield-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodshield"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks:
      - foodshield-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - foodshield-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://foodshield:foodshield@db:5432/mlflow
    depends_on:
      db:
        condition: service_healthy
    networks:
      - foodshield-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - foodshield-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    depends_on:
      - prometheus
    networks:
      - foodshield-net
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  foodshield-net:
    driver: bridge
